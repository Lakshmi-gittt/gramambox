<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch Video - StoryDrop</title>

    <!-- ========================= -->
    <!-- Open Graph Metadata        -->
    <!-- ========================= -->

    <meta property="og:title"
          content="Watch this video on StoryDrop">

    <meta property="og:description"
          content="Watch this video shared with StoryDrop.">

    <meta property="og:image"
          content="{{ video.cloudinary_thumbnail_url }}">

    <meta property="og:url"
          content="{{ request.url }}">

    <meta property="og:type"
          content="video.other">

    <meta property="og:site_name"
          content="StoryDrop">

    <!-- Image information -->
    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:image:alt"
          content="StoryDrop video preview">


    <!-- ========================= -->
    <!-- Twitter/X Metadata         -->
    <!-- ========================= -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Watch this video on StoryDrop">

    <meta name="twitter:description"
          content="Watch this video shared with StoryDrop.">

    <meta name="twitter:image"
          content="{{ video.cloudinary_thumbnail_url }}">

    <meta name="twitter:image:alt"
          content="StoryDrop video preview">


    <!-- ========================= -->
    <!-- Normal Browser Metadata    -->
    <!-- ========================= -->

    <meta name="description"
          content="Watch this video shared with StoryDrop.">

</head>


<body>

    <h1>Watch Video</h1>

    <video
        controls
        width="100%"
        preload="metadata"
        poster="{{ video.cloudinary_thumbnail_url }}"
    >

        <source
            src="{{ video.cloudinary_video_url }}"
            type="video/mp4"
        >

        Your browser does not support video playback.

    </video>

</body>

</html>
