{% extends "base.html" %}

{% block title %}Login - GramamBox{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome back</h1>

        <p style="color:#888;">
            Log in to manage your videos.
        </p>

        <form
            action="/login"
            method="POST"
        >

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn form-button"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
