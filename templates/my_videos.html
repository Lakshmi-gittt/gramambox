<!DOCTYPE html>
<html>
<head>
    <title>My Videos</title>
</head>

<body>

<h1>My Videos</h1>

{% for video in videos %}

<h3>{{ video.original_filename }}</h3>

<p>
    Stored File:
    {{ video.stored_filename }}
</p>

<p>
    Uploaded:
    {{ video.uploaded_at }}
</p>

<p>
    👁 Views: {{ video.views }}
</p>

<p>
    Share Link:

    <input
        type="text"
        id="link-{{ video.id }}"
        value="{{ request.base_url }}v/{{ video.stored_filename }}"
        readonly
    >

    <button onclick="copyLink('{{ video.id }}')">
        Copy Link
    </button>

    <button onclick="deleteVideo('{{ video.id }}')">
    Delete
    </button>
</p>

<hr>

{% endfor %}


<script>
function copyLink(videoId) {

    const link = document.getElementById("link-" + videoId);

    navigator.clipboard.writeText(link.value);

    alert("Share link copied!");
}
async function deleteVideo(videoId) {

    const confirmed = confirm(
        "Are you sure you want to delete this video?"
    );

    if (!confirmed) {
        return;
    }

    const response = await fetch(
        "/delete/" + videoId,
        {
            method: "DELETE"
        }
    );

    const data = await response.json();

    alert(data.message);

    if (response.ok) {
        location.reload();
    }
}

</script>

</body>
</html>
