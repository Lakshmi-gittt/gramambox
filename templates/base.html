<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}GramamBox{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">
        GramamBox
    </a>

    <div class="nav-links">

        {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/my-videos">My Videos</a>
            <a href="/upload" class="nav-upload">
                Upload
            </a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/signup" class="nav-upload">
                Sign up
            </a>
        {% endif %}

    </div>

</nav>


<main>
    {% block content %}
    {% endblock %}
</main>


<script
    src="{{ url_for('static', path='js/app.js') }}">
</script>

</body>
</html>
